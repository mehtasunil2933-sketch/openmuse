name: Android APK

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    tags:
      - "v*"                  # git tag v0.1.0 && git push --tags -> build + GitHub Release

permissions:
  contents: write             # needed to attach the APK to a Release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable EXPO_PUBLIC_API_URL first"; exit 1
          fi
          echo "Building app for API: $EXPO_PUBLIC_API_URL"

      - name: Setup pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK (arm64 phones)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_IN=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out out/openmuse.apk "$APK_IN"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs out/openmuse.apk | head -3
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No keystore secrets set - APK uses a throwaway debug key (uninstall before each install)"
            cp "$APK_IN" out/openmuse.apk
          fi
          ls -lh out/openmuse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-apk
          path: out/openmuse.apk
          retention-days: 14

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/openmuse.apk
